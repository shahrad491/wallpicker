[package]
name = "wallpicker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
blake3 = "1"
rayon = "1"
rand = "0.9"
# Use native sRGB/linear rendering, rather than web-colors on a float Wayland
# surface. The app supplies its own theme; portal theme detection is unnecessary.
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "image", "lazy", "advanced", "tokio", "x11", "wayland"] }
libc = "0.2"
log = "0.4"

[dev-dependencies]
tempfile = "3"

# Image decoding/resizing and Iced rendering need optimized dependencies even during
# `cargo run`; keep wallpicker itself debuggable for normal development.
[profile.dev.package."*"]
opt-level = 2
